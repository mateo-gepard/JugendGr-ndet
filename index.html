<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JG Experiment Tracker v2.0</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="logo">
                <span class="logo-icon">⚗️</span>
                <span class="logo-text">JG Tracker</span>
                <span class="version">v2.0</span>
            </div>
            <div class="nav-items">
                <div class="nav-item active" data-view="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Home</span>
                </div>
                <div class="nav-item" data-view="new-run">
                    <span class="nav-icon">▶️</span>
                    <span class="nav-label">Starten</span>
                </div>
                <div class="nav-item" data-view="runs">
                    <span class="nav-icon">�</span>
                    <span class="nav-label">Versuche</span>
                </div>
                <div class="nav-item" data-view="analysis">
                    <span class="nav-icon">�</span>
                    <span class="nav-label">Analyse</span>
                </div>
            </div>
            <div class="sidebar-footer">
                <button id="reset-data" class="btn-reset">Zurücksetzen</button>
            </div>
        </nav>

        <main class="main-content">
            <div id="dashboard-view" class="view active">
                <header class="view-header">
                    <h1>Dashboard</h1>
                </header>

                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-value" id="total-runs">0</span>
                        <span class="stat-label">Gestartet</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="completed-runs">0</span>
                        <span class="stat-label">Fertig</span>
                    </div>
                    <div class="stat-card accent">
                        <span class="stat-value" id="best-bsc">-</span>
                        <span class="stat-label">Bestes BSC</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="avg-bsc">-</span>
                        <span class="stat-label">Ø BSC</span>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <h3>Fortschritt</h3>
                        <div id="experiment-progress" class="progress-list"></div>
                    </div>
                    <div class="dashboard-card">
                        <h3>Zuletzt bearbeitet</h3>
                        <div id="recent-activity" class="activity-list"></div>
                    </div>
                </div>

                <div class="quick-start">
                    <button onclick="showView('new-run')" class="btn-primary btn-large">+ Neuen Versuch starten</button>
                </div>
            </div>

            <div id="new-run-view" class="view">
                <header class="view-header">
                    <h1>Versuch wählen</h1>
                </header>

                <div id="predefined-runs" class="runs-container"></div>

                <div class="custom-section">
                    <button id="toggle-custom" class="btn-secondary">+ Eigenen Versuch</button>
                    <div id="custom-run-form" class="custom-form hidden">
                        <input type="text" id="custom-run-name" placeholder="Name">
                        <textarea id="custom-run-desc" placeholder="Was willst du testen?"></textarea>
                        <button onclick="createCustomRun()" class="btn-primary">Erstellen</button>
                    </div>
                </div>
            </div>

            <div id="active-run-view" class="view">
                <header class="view-header run-header">
                    <div>
                        <h1 id="active-run-title">Versuch</h1>
                        <p id="active-run-desc" class="subtitle"></p>
                    </div>
                    <span id="current-phase-badge" class="phase-badge">Phase 1/8</span>
                </header>

                <div id="phase-tabs" class="phase-tabs"></div>

                <div id="phase-content" class="phase-content"></div>

                <div class="phase-navigation">
                    <button id="prev-phase-btn" onclick="previousPhase()" class="btn-secondary">← Zurück</button>
                    <button id="save-phase-btn" onclick="saveCurrentPhase()" class="btn-primary">Phase abschließen ✓</button>
                    <button id="next-phase-btn" onclick="nextPhase()" class="btn-secondary">Weiter →</button>
                </div>
            </div>

            <div id="runs-view" class="view">
                <header class="view-header">
                    <h1>Alle Versuche</h1>
                </header>
                <div id="runs-list" class="runs-list"></div>
            </div>

            <div id="analysis-view" class="view">
                <header class="view-header">
                    <h1>Analyse</h1>
                </header>

                <div class="analysis-grid">
                    <div class="analysis-card ranking-card">
                        <h3>Ranking</h3>
                        <div id="bsc-ranking"></div>
                    </div>
                    <div class="analysis-card">
                        <h3>Was beeinflusst BSC?</h3>
                        <div id="parameter-comparison"></div>
                    </div>
                    <div class="analysis-card full-width">
                        <h3>Erkenntnisse</h3>
                        <div id="insights"></div>
                    </div>
                </div>

                <div class="export-section">
                    <h3>Export</h3>
                    <div class="export-buttons">
                        <button onclick="exportCSV()" class="btn-export">CSV</button>
                        <button onclick="exportJSON()" class="btn-export">Backup</button>
                        <label class="btn-export btn-import">
                            Import
                            <input type="file" accept=".json" onchange="importData(event)" hidden>
                        </label>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
